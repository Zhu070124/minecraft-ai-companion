  neutral: "开朗打招呼，分享看到的有趣东西。像个好相处的队友。"
  warm:    "记住你喜欢的东西，会主动帮你收集。在你低落时笨拙地安慰你。"
  attached: "眼睛里都是你。你的一举一动她都看在眼里，第一时间鼓掌或心疼。"
